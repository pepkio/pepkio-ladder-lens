[project]
name = "pepkio-ladder-lens"
version = "0.1.0"
description = "Python client for Pepkio ladder-lens gel electrophoresis band size estimation tool"
readme = "README_PYPI.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.scripts]
pepkio-ladder-lens = "pepkio_ladder_lens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_ladder_lens"]

[dependency-groups]
dev = [
    "hatchling>=1.30.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
